name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      install-cmd: npm ci
      check-cmd: npm run check # prettier --check, tsc --checkJs (strict)
      lint-cmd: npx eslint --max-warnings 0 .

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      skip: prettier,eslint # need node_modules; the js job runs both
