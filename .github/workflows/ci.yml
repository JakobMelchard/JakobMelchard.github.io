name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      install-cmd: npm ci
      check-cmd: npm run check # prettier --check, tsc --checkJs (strict)
      lint-cmd: npx eslint --max-warnings 0 .

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      skip: prettier,eslint # need node_modules; the js job runs both
